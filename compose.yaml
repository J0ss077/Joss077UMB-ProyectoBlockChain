# PostgreSQL 16 del piso declarado (REQ-20, REQ-23), igual para `docker compose`
# y para `podman compose` (decisión 10 del diseño).
services:
  postgres:
    image: postgres:16-alpine
    # Solo las credenciales que PostgreSQL necesita, tomadas de `.env` por la
    # sustitución de variables de compose (REQ-21). Pasarle el archivo entero le
    # entregaría además `MASTER_KEY` y `DATABASE_URL`, que no usa y que no tienen
    # por qué entrar al contenedor.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Publicado solo en la interfaz local: la base no tiene por qué escuchar en
      # toda la red. El puerto del host es el que declara `.env` y el de la derecha
      # es el que escucha PostgreSQL dentro de la imagen: si los dos fueran fijos,
      # cambiar `POSTGRES_PORT` dejaría a la aplicación sin poder conectarse.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # El esquema se aplica solo al crear el volumen; para volver a aplicarlo
      # hay que borrar el volumen (el reinicio limpio está en el README).
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      # `$$` deja que la variable la expanda el shell dentro del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
